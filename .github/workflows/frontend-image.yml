# Builds the frontend Docker image (Vite build served by nginx on port 80),
# pushes it to GitHub Container Registry and asks Dokploy to redeploy it.
# Dokploy no longer builds anything: its frontend application uses Source
# "Docker" with ghcr.io/<owner>/bank-frontend:latest.
#
# Runs on a push to main that changes frontend/, or by hand (Actions tab ->
# "Frontend image" -> Run workflow).
#
# Variable (Settings -> Secrets and variables -> Actions -> Variables):
#   VITE_API_URL  the backend API the website calls; baked into the bundle.
#                 Defaults to https://api.thriftrpr.in/api.
# Secrets: either
#   DOKPLOY_FRONTEND_WEBHOOK      the app's deploy webhook URL (Deployments tab), or
#   DOKPLOY_URL, DOKPLOY_API_KEY  (shared with the backend workflow) and
#   DOKPLOY_FRONTEND_APP_ID       the frontend application's id
# Without the secrets the image is still built and pushed; only the deploy is skipped.
name: Frontend image

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-image.yml'
  workflow_dispatch:

concurrency:
  group: frontend-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lower case, as GHCR requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bank-frontend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.thriftrpr.in/api' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Deploy on Dokploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_FRONTEND_WEBHOOK }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APP_ID: ${{ secrets.DOKPLOY_FRONTEND_APP_ID }}
        run: |
          # Preferred: the app's deploy webhook (Dokploy -> app -> Deployments
          # -> Webhook URL), kept as the secret DOKPLOY_FRONTEND_WEBHOOK.
          # Otherwise Dokploy's API with an API key and the application id.
          WEBHOOK="$(echo "$WEBHOOK" | tr -d '[:space:]')"
          if [ -n "$WEBHOOK" ]; then
            code=$(curl -sS --retry 3 -o response.txt -w '%{http_code}' -X POST "$WEBHOOK" -H "Content-Type: application/json" -d '{}')
          elif [ -n "$DOKPLOY_URL" ] && [ -n "$DOKPLOY_API_KEY" ] && [ -n "$APP_ID" ]; then
            APP_ID="$(echo "$APP_ID" | tr -d '[:space:]')"
            URL="${DOKPLOY_URL%/}"
            URL="${URL%/api}"
            code=$(curl -sS --retry 3 -o response.txt -w '%{http_code}' -X POST "$URL/api/application.deploy" \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"applicationId\":\"$APP_ID\"}")
          else
            echo "::warning::No Dokploy webhook / API secrets: image pushed, deploy skipped."
            exit 0
          fi
          # Dokploy's own answer is printed, so a wrong id or key is visible.
          echo "Dokploy answered HTTP $code:"
          cat response.txt; echo
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::Dokploy refused the request: check the webhook URL / API key."; exit 1
          fi
          if [ "$code" = "404" ]; then
            echo "::error::Dokploy did not find the app: check DOKPLOY_FRONTEND_WEBHOOK (or DOKPLOY_FRONTEND_APP_ID)."; exit 1
          fi
          if [ "$code" -ge 300 ]; then echo "::error::Dokploy deploy failed (HTTP $code)."; exit 1; fi
          echo "Dokploy deploy queued for $IMAGE:latest"
