# Builds the frontend Docker image (Vite build served by nginx on port 80),
# pushes it to GitHub Container Registry and asks Dokploy to redeploy it.
# Dokploy no longer builds anything: its frontend application uses Source
# "Docker" with ghcr.io/<owner>/bank-frontend:latest.
#
# Runs on a push to main that changes frontend/, or by hand (Actions tab ->
# "Frontend image" -> Run workflow).
#
# Variable (Settings -> Secrets and variables -> Actions -> Variables):
#   VITE_API_URL  the backend API the website calls; baked into the bundle.
#                 Defaults to https://api.thriftrpr.in/api.
# Secrets:
#   DOKPLOY_URL, DOKPLOY_API_KEY  (shared with the backend workflow)
#   DOKPLOY_FRONTEND_APP_ID       the frontend application's id
# Without the secrets the image is still built and pushed; only the deploy is skipped.
name: Frontend image

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-image.yml'
  workflow_dispatch:

concurrency:
  group: frontend-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lower case, as GHCR requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bank-frontend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.thriftrpr.in/api' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Deploy on Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APP_ID: ${{ secrets.DOKPLOY_FRONTEND_APP_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$APP_ID" ]; then
            echo "::warning::Dokploy secrets not set: image pushed, deploy skipped."
            exit 0
          fi
          curl -fsS --retry 3 --retry-all-errors -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}"
          echo
          echo "Dokploy deploy queued for $IMAGE:latest"
