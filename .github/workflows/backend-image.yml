# Builds the backend Docker image, pushes it to GitHub Container Registry and
# asks Dokploy to redeploy it. Dokploy no longer builds anything: its backend
# application uses Source "Docker" with ghcr.io/<owner>/bank-backend:latest.
#
# Runs on a push to main that changes backend/, or by hand (Actions tab ->
# "Backend image" -> Run workflow).
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   DOKPLOY_URL             e.g. https://dokploy.example.com (no trailing /api)
#   DOKPLOY_API_KEY         Dokploy -> Settings -> Profile -> API/CLI -> Generate
#   DOKPLOY_BACKEND_APP_ID  the backend application's id (in its Dokploy URL)
# Without them the image is still built and pushed; only the deploy is skipped.
name: Backend image

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

concurrency:
  group: backend-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lower case, as GHCR requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bank-backend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest = what Dokploy runs; sha-xxxxxxx = every build kept for rollback.
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Deploy on Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APP_ID: ${{ secrets.DOKPLOY_BACKEND_APP_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$APP_ID" ]; then
            echo "::warning::Dokploy secrets not set: image pushed, deploy skipped."
            exit 0
          fi
          curl -fsS --retry 3 --retry-all-errors -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}"
          echo
          echo "Dokploy deploy queued for $IMAGE:latest"
