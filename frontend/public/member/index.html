<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The member app, built for browsers (iPhone / iPad / desktop users have
       no APK). Built with `tool/build_web.sh`, which sets the base href. -->
  <base href="/member/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Thrift RPR: balances, passbooks and transactions for members and employees.">
  <meta name="theme-color" content="#F8FAFC">

  <!-- iOS: "Add to Home Screen" opens it full screen like an app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Thrift RPR">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Thrift RPR</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F8FAFC; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash img { width: 96px; height: 96px; }
  </style>
</head>
<body>
  <!-- Shown until Flutter draws its first frame. -->
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
