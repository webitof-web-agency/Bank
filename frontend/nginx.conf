# Static web app. Dokploy's Traefik terminates HTTPS in front of it.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Vite's hashed bundles never change under the same name.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The member app's Flutter web copy (frontend/public/member) has its own
  # index.html; its file names are not hashed, so they are revalidated.
  location /member/ {
    try_files $uri $uri/ /member/index.html;
    add_header Cache-Control "no-cache";
  }

  # Every other path is a React route (BrowserRouter): serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
